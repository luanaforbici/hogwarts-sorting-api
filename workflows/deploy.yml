name: Deploy to GCP Cloud Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Serverless Function
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Enable GCP APIs
      run: |
        gcloud services enable cloudresourcemanager.googleapis.com cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com

    - name: Deploy Cloud Function
        run: |
          gcloud functions deploy hogwarts-sorting-pubsub \
            --gen2 \
            --runtime=python311 \
            --region=us-central1 \
            --source=. \
            --entry-point=subscribe \
            --trigger-topic=hogwarts-sorting-topic \
            --memory=512Mi